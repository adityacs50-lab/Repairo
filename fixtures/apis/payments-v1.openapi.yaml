openapi: 3.0.3
info:
  title: Payments API
  version: 1.2.0
  description: Checkout and refunds for merchant integrations
servers:
  - url: https://api.acme-payments.com/v1
paths:
  /charges:
    post:
      operationId: createCharge
      summary: Create a payment charge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChargeRequest"
      responses:
        "201":
          description: Charge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charge"
  /charges/{chargeId}:
    get:
      operationId: getCharge
      summary: Retrieve a charge
      parameters:
        - name: chargeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Charge details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Charge"
  /refunds:
    post:
      operationId: createRefund
      summary: Refund a charge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefundRequest"
      responses:
        "201":
          description: Refund created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
components:
  schemas:
    CreateChargeRequest:
      type: object
      required:
        - amount
        - currency
        - customerId
      properties:
        amount:
          type: integer
          description: Amount in cents
        currency:
          type: string
          enum: [usd, eur, gbp]
        customerId:
          type: string
        description:
          type: string
    Charge:
      type: object
      required:
        - id
        - amount
        - currency
        - status
      properties:
        id:
          type: string
        amount:
          type: integer
        currency:
          type: string
        status:
          type: string
          enum: [pending, succeeded, failed]
        customerId:
          type: string
    CreateRefundRequest:
      type: object
      required:
        - chargeId
        - amount
      properties:
        chargeId:
          type: string
        amount:
          type: integer
    Refund:
      type: object
      required:
        - id
        - chargeId
        - amount
        - status
      properties:
        id:
          type: string
        chargeId:
          type: string
        amount:
          type: integer
        status:
          type: string
          enum: [pending, succeeded, failed]
