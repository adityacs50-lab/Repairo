services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_PATH: /app/data/repairo.db
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    volumes:
      - repairo-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # GitHub App webhook server (src/github-app). Reads APP_ID, PRIVATE_KEY and
  # WEBHOOK_SECRET from .env.local; SQLite lives on its own volume.
  github-app:
    build:
      context: .
      dockerfile: Dockerfile.github-app
    ports:
      - "3001:3000"
    env_file:
      - .env.local
    environment:
      PORT: "3000"
      DATABASE_PATH: /app/data/repairo.db
    volumes:
      - repairo-github-app-data:/app/data
    restart: unless-stopped

volumes:
  repairo-data:
  repairo-github-app-data:
