<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="640" height="180">
  <!-- Minimalist Code-Bracket Remediation Logo (Light Theme/Dark BG) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Bracket < -->
    <path d="M 85,55 L 55,90 L 85,125" stroke="#ffffff" stroke-width="14" />
    <!-- Right Bracket > -->
    <path d="M 95,55 L 125,90 L 95,125" stroke="#ffffff" stroke-width="14" />
    <!-- Healing Slash / (Premium green accent) -->
    <path d="M 70,135 L 110,45" stroke="#10B981" stroke-width="12" />
  </g>
  <!-- Wordmark -->
  <text x="170" y="122"
        font-family="Geist, Inter, system-ui, -apple-system, sans-serif"
        font-size="82"
        font-weight="700"
        letter-spacing="-3.5"
        fill="#ffffff">repairo</text>
</svg>
